[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaidra"
version = "0.1.0"
description = "Shaidra: a deep web vulnerability scanner CLI that orchestrates battle-tested recon and scanning tools into one parallel pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shaidra" }]
keywords = ["security", "vulnerability-scanner", "bug-bounty", "pentest", "recon"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=8.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
shaidra = "shaidra.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

# The repository root IS the `shaidra` package (flat layout). package-dir maps
# the installed package name onto this directory so `import shaidra` works
# without a nested shaidra/ folder.
[tool.setuptools]
packages = ["shaidra", "shaidra.core", "shaidra.stages", "shaidra.aggregator", "shaidra.output", "shaidra.utils", "shaidra.tui"]
package-dir = { shaidra = "." }

[tool.setuptools.package-data]
shaidra = ["config.yaml", "wordlists/*.txt", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF", "ISC", "PYI", "FURB"]
ignore = [
    "E501", # the codebase intentionally keeps a few lines past the configured width
    "N999", # flat layout: the package root directory is "Shaidra", not snake_case
    "B006", # typer multi-value options require a mutable list default
]

[tool.ruff.lint.isort]
known-first-party = ["shaidra"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
# Match absolute paths too (junction shim under -p shaidra uses full paths).
exclude = [
    "(^|[/\\\\])tests([/\\\\]|$)",
    "(^|[/\\\\])scripts([/\\\\]|$)",
    "(^|[/\\\\])build([/\\\\]|$)",
    "(^|[/\\\\])dist([/\\\\]|$)",
]

[[tool.mypy.overrides]]
module = ["yaml.*", "textual.*", "typer.*"]
ignore_missing_imports = true
